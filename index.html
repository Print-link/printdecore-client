  <title>Printdecore - Print Services Across Africa</title>
  <script>
    // Apply theme immediately to prevent flash of wrong theme
    (function () {
      const stored = localStorage.getItem('piper_theme');
      const theme = stored === 'dark' || stored === 'light'
        ? stored
        : window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';

      const root = document.documentElement;
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        root.classList.add('dark');
      } else {
        root.removeAttribute('data-theme');
        root.classList.remove('dark');
      }
    })();
  </script>
  <script>
    // Launch splash: only in the installed app (home screen / dock), once per
    // cold start. ?splash=1 previews it in a browser tab; ?splash=still shows
    // the first frame (used to render the iPhone launch images).
    (function () {
      var q = location.search;
      var force = /[?&]splash=(1|still)\b/.test(q);
      var mm = function (m) { return window.matchMedia && window.matchMedia(m).matches; };
      var installed = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || navigator.standalone === true;
      var seen = false;
      try { seen = sessionStorage.getItem('pd_splash') === '1'; } catch (e) {}
      if (!force && (!installed || seen)) return;
      try { sessionStorage.setItem('pd_splash', '1'); } catch (e) {}

      var root = document.documentElement;
      root.classList.add('pd-splash');
      if (/[?&]splash=still\b/.test(q)) root.classList.add('pd-splash-still');

      var reduced = mm('(prefers-reduced-motion: reduce)');
      // Opened at a specific page (a notification, a shortcut): get them there fast
      var deepLink = !/^\/(home\/?)?$/.test(location.pathname);
      window.__pdSplash = {
        t0: performance.now(),
        min: reduced ? 500 : deepLink ? 650 : 1700,
        max: 8000
      };

      // Dark status bar while the splash is up (restored on hand-off)
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { window.__pdSplash.theme = meta.content; meta.content = '#111111'; }
    })();
  </script>
  <style>
    #pd-splash { display: none; }
    html.pd-splash, html.pd-splash body { overflow: hidden; background: #111111; }
    html.pd-splash #pd-splash { display: block; }

    #pd-splash {
      position: fixed; inset: 0; z-index: 2147483000;
      background: #111111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      transition: opacity .42s cubic-bezier(.4, 0, .2, 1), visibility .42s;
    }
    #pd-splash .pd-glow {
      position: absolute; inset: 0; opacity: 0;
      background:
        radial-gradient(46vmax 30vmax at 50% 50%, rgba(251, 191, 36, .16), rgba(251, 191, 36, 0) 70%),
        radial-gradient(80vmax 60vmax at 50% 120%, rgba(251, 191, 36, .07), rgba(251, 191, 36, 0) 70%);
      animation: pdFade 1.2s .1s ease-out both;
    }
    #pd-splash .pd-stage {
      position: absolute; inset: 0;
      transition: transform .42s cubic-bezier(.4, 0, .2, 1), filter .42s;
    }

    /* The app icon, centred exactly — the launch images draw it in the same place */
    #pd-splash .pd-tile {
      position: absolute; left: 50%; top: 50%;
      width: 112px; height: 112px; margin: -56px 0 0 -56px;
      border-radius: 26px; background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 22px 48px -18px rgba(251, 191, 36, .45);
      animation: pdBreathe 1.5s .05s cubic-bezier(.45, 0, .2, 1) both;
    }
    #pd-splash .pd-tile svg { position: absolute; left: 14px; top: 14px; width: 84px; height: 84px; overflow: visible; }
    #pd-splash .pd-ring {
      position: absolute; inset: -1px; border-radius: 27px;
      border: 2px solid #fbbf24; opacity: 0; pointer-events: none;
    }
    #pd-splash .pd-ring.r1 { animation: pdRing 1.1s .2s cubic-bezier(.2, .7, .3, 1) both; }
    #pd-splash .pd-ring.r2 { animation: pdRing 1.2s 1.25s cubic-bezier(.2, .7, .3, 1) both; }

    /* Printer parts */
    #pd-splash .pd-in { animation: pdFeed .5s .45s cubic-bezier(.65, 0, .35, 1) both; }
    #pd-splash .pd-slot { animation: pdSlot .9s .7s ease-in-out both; }
    #pd-splash .pd-shine { animation: pdShine .7s .72s cubic-bezier(.45, 0, .2, 1) both; }
    #pd-splash .pd-out { transform: translateY(-150px); animation: pdEject .62s .82s cubic-bezier(.2, .9, .25, 1.08) both; }
    #pd-splash .pd-ln { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    #pd-splash .pd-ln.l1 { animation: pdPrint .3s 1.06s cubic-bezier(.3, 0, .2, 1) both; }
    #pd-splash .pd-ln.l2 { animation: pdPrint .3s 1.15s cubic-bezier(.3, 0, .2, 1) both; }
    #pd-splash .pd-ln.l3 { animation: pdPrint .3s 1.24s cubic-bezier(.3, 0, .2, 1) both; }

    /* Wordmark, below the icon */
    #pd-splash .pd-word {
      position: absolute; left: 0; right: 0; top: calc(50% + 80px);
      text-align: center; white-space: nowrap;
      font-size: 32px; font-weight: 900; font-style: italic; letter-spacing: -.02em; line-height: 1;
    }
    #pd-splash .pd-word span { display: inline-block; opacity: 0; animation: pdRise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(1.0s + var(--i) * 32ms); }
    #pd-splash .pd-word .d { color: #fbbf24; }
    #pd-splash .pd-tag {
      position: absolute; left: 0; right: 0; top: calc(50% + 124px);
      text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255, 255, 255, .5); opacity: 0;
      animation: pdRise .7s 1.42s cubic-bezier(.2, .8, .2, 1) both;
    }

    /* Only seen when the app takes longer than the animation */
    #pd-splash .pd-load {
      position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
      width: 120px; height: 3px; margin-left: -60px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, .08); opacity: 0;
      animation: pdFade .4s 2.2s ease-out both;
    }
    #pd-splash .pd-load::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0), #fbbf24, rgba(251, 191, 36, 0));
      animation: pdBar 1.1s 2.2s ease-in-out infinite both;
    }

    /* Hand-off to the app */
    #pd-splash.pd-exit { opacity: 0; visibility: hidden; }
    #pd-splash.pd-exit .pd-stage { transform: scale(1.08); filter: blur(3px); }

    @keyframes pdFade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pdBreathe { 0% { transform: scale(1) } 22% { transform: scale(.93) } 48% { transform: scale(1.04) } 70%, 100% { transform: scale(1) } }
    @keyframes pdRing { 0% { opacity: 0; transform: scale(1) } 8% { opacity: .75; transform: scale(1.03) } 100% { opacity: 0; transform: scale(1.65) } }
    @keyframes pdFeed { 0% { transform: translateY(0) } 100% { transform: translateY(34px) } }
    @keyframes pdSlot { 0%, 100% { fill: #fff } 35%, 60% { fill: #fde68a } }
    @keyframes pdShine { from { transform: translateX(0) } to { transform: translateX(620px) } }
    @keyframes pdEject { from { transform: translateY(-150px) } to { transform: translateY(0) } }
    @keyframes pdPrint { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes pdRise { from { opacity: 0; transform: translateY(14px); filter: blur(6px) } to { opacity: 1; transform: none; filter: none } }
    @keyframes pdBar { from { left: -40% } to { left: 100% } }

    /* First frame only (launch images) */
    html.pd-splash-still #pd-splash *, html.pd-splash-still #pd-splash *::after { animation: none !important; }

    /* Reduce Motion: the finished picture, and a plain fade out */
    @media (prefers-reduced-motion: reduce) {
      #pd-splash *, #pd-splash *::after { animation: none !important; }
      #pd-splash .pd-glow, #pd-splash .pd-word span, #pd-splash .pd-tag { opacity: 1; }
      #pd-splash .pd-out, #pd-splash .pd-ln { transform: none; }
      #pd-splash .pd-in { transform: translateY(34px); }
      #pd-splash.pd-exit .pd-stage { transform: none; filter: none; }
    }
  </style>
</head>

<body>

      <div class="pd-word"><span style="--i:0">p</span><span style="--i:1">r</span><span style="--i:2">i</span><span style="--i:3">n</span><span style="--i:4">t</span><span class="d" style="--i:5">d</span><span class="d" style="--i:6">e</span><span class="d" style="--i:7">c</span><span class="d" style="--i:8">o</span><span class="d" style="--i:9">r</span><span class="d" style="--i:10">e</span></div>

  <script>
    // Hand-off: the app calls __pdSplashReady() once its first screen is up.
    // The splash finishes its animation (min), never outstays the app, and a
    // tap skips it. If the app never reports in, it still leaves after max.
    (function () {
      var s = window.__pdSplash;
      var el = document.getElementById('pd-splash');
      if (!s || !el) { window.__pdSplashReady = function () {}; return; }
      var gone = false, ready = false, timer;
      function leave() {
        if (gone) return;
        gone = true;
        el.classList.add('pd-exit');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && s.theme) meta.content = s.theme;
        setTimeout(function () {
          el.parentNode && el.parentNode.removeChild(el);
          document.documentElement.classList.remove('pd-splash', 'pd-splash-still');
        }, 450);
      }
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(leave, Math.max(0, s.min - (performance.now() - s.t0)));
      }
      window.__pdSplashReady = function () { if (!ready) { ready = true; if (!document.documentElement.classList.contains('pd-splash-still')) schedule(); } };
      el.addEventListener('click', function () { s.min = 0; if (ready) schedule(); });
      if (!document.documentElement.classList.contains('pd-splash-still')) setTimeout(leave, s.max);
    })();
  </script>
