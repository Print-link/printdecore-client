  <title>Printdecore - Print Services Across Africa</title>
  <script>
    // Apply theme immediately to prevent flash of wrong theme
    (function () {
      const stored = localStorage.getItem('piper_theme');
      const theme = stored === 'dark' || stored === 'light'
        ? stored
        : window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';

      const root = document.documentElement;
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        root.classList.add('dark');
      } else {
        root.removeAttribute('data-theme');
        root.classList.remove('dark');
      }
    })();
  </script>
  <script>
    // Launch splash: only in the installed app (home screen / dock), once per
    // cold start. ?splash=1 previews it in a browser tab; ?splash=still shows
    // the first frame (used to render the iPhone launch images).
    (function () {
      var q = location.search;
      var force = /[?&]splash=(1|still)\b/.test(q);
      var mm = function (m) { return window.matchMedia && window.matchMedia(m).matches; };
      var installed = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || navigator.standalone === true;
      var seen = false;
      try { seen = sessionStorage.getItem('pd_splash') === '1'; } catch (e) {}
      if (!force && (!installed || seen)) return;
      try { sessionStorage.setItem('pd_splash', '1'); } catch (e) {}

      var root = document.documentElement;
      root.classList.add('pd-splash');
      if (/[?&]splash=still\b/.test(q)) root.classList.add('pd-splash-still');

      var reduced = mm('(prefers-reduced-motion: reduce)');
      // Opened at a specific page (a notification, a shortcut): get them there fast
      var deepLink = !/^\/(home\/?)?$/.test(location.pathname);
      window.__pdSplash = {
        t0: performance.now(),
        min: deepLink || reduced ? 300 : 700,
        max: 8000
      };

      // Dark status bar while the splash is up (restored on hand-off)
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { window.__pdSplash.theme = meta.content; meta.content = '#0e0e0e'; }
    })();
  </script>
  <style>
    /* Launch splash: flat and still, like a native launch screen. The iPhone
       launch images are this exact picture, so the hand-off is seamless. */
    #pd-splash { display: none; }
    html.pd-splash, html.pd-splash body { overflow: hidden; background: #0e0e0e; }
    html.pd-splash #pd-splash { display: block; }

    #pd-splash {
      position: fixed; inset: 0; z-index: 2147483000;
      background: #0e0e0e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      transition: opacity .3s cubic-bezier(.4, 0, .2, 1), visibility .3s;
    }

    /* The app icon, centred exactly */
    #pd-splash .pd-tile {
      position: absolute; left: 50%; top: 50%;
      width: 96px; height: 96px; margin: -48px 0 0 -48px;
      border-radius: 22px; background: #fff;
    }
    #pd-splash .pd-tile svg { position: absolute; left: 12px; top: 12px; width: 72px; height: 72px; }

    #pd-splash .pd-word {
      position: absolute; left: 0; right: 0; top: calc(50% + 68px);
      text-align: center; white-space: nowrap;
      font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: -.02em; line-height: 1;
    }
    #pd-splash .pd-word .d { color: #fbbf24; }
    #pd-splash .pd-tag {
      position: absolute; left: 0; right: 0; top: calc(50% + 104px);
      text-align: center; font-size: 15px; color: rgba(255, 255, 255, .55);
    }

    /* Only seen when the app takes a while */
    #pd-splash .pd-load {
      position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
      width: 96px; height: 2px; margin-left: -48px; border-radius: 2px; overflow: hidden;
      background: rgba(255, 255, 255, .1); opacity: 0;
      animation: pdFade .3s 1.6s ease-out both;
    }
    #pd-splash .pd-load::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px;
      background: #fbbf24;
      animation: pdBar 1s 1.6s ease-in-out infinite both;
    }

    /* Hand-off to the app */
    #pd-splash.pd-exit { opacity: 0; visibility: hidden; }

    @keyframes pdFade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pdBar { from { left: -40% } to { left: 100% } }

    html.pd-splash-still #pd-splash .pd-load { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #pd-splash .pd-load::after { animation: none; left: 30%; }
    }
  </style>

  <script>
    // Hand-off: the app calls __pdSplashReady() once its first screen is up.
    // The splash finishes its animation (min), never outstays the app, and a
    // tap skips it. If the app never reports in, it still leaves after max.
    (function () {
      var s = window.__pdSplash;
      var el = document.getElementById('pd-splash');
      if (!s || !el) { window.__pdSplashReady = function () {}; return; }
      var gone = false, ready = false, timer;
      function leave() {
        if (gone) return;
        gone = true;
        el.classList.add('pd-exit');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && s.theme) meta.content = s.theme;
        setTimeout(function () {
          el.parentNode && el.parentNode.removeChild(el);
          document.documentElement.classList.remove('pd-splash', 'pd-splash-still');
        }, 320);
      }
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(leave, Math.max(0, s.min - (performance.now() - s.t0)));
      }
      window.__pdSplashReady = function () { if (!ready) { ready = true; if (!document.documentElement.classList.contains('pd-splash-still')) schedule(); } };
      el.addEventListener('click', function () { s.min = 0; if (ready) schedule(); });
      if (!document.documentElement.classList.contains('pd-splash-still')) setTimeout(leave, s.max);
    })();
  </script>
